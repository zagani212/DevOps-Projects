spring.application.name=login-app
server.port=80

# AWS Secrets Manager Configuration (REQUIRED)
# Database credentials are fetched from AWS Secrets Manager only
# No plain text credentials in this file
aws.secrets.name=login-app-db-secrets
aws.region=eu-west-3

# AWS RDS MySQL Database Configuration
# Credentials will be loaded from AWS Secrets Manager by SecretsManagerConfig
# Placeholder values - will be overridden by Secrets Manager on startup
spring.datasource.url=jdbc:mysql://placeholder:3306/placeholder
spring.datasource.username=placeholder
spring.datasource.password=placeholder
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# Automatic table creation and schema updates
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# View Configuration (JSP)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# JPA/Hibernate Configuration
# ddl-auto=update: Creates tables if they don't exist, updates schema if needed
# Never drops existing tables (safe for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# View Configuration (JSP)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

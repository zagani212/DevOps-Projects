spring.application.name=login-app
server.port=8080

# AWS Secrets Manager Configuration (REQUIRED)
# Database credentials are fetched from AWS Secrets Manager only
# No plain text credentials in this file
aws.secrets.name=login-app-db-secret
aws.region=eu-west-3

# AWS RDS MySQL Database Configuration
# Credentials will be loaded from AWS Secrets Manager by SecretsManagerConfig
# Placeholder values - will be overridden by Secrets Manager on startup
spring.datasource.url=jdbc:mysql://placeholder:3306/placeholder
spring.datasource.username=placeholder
spring.datasource.password=placeholder
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# View Configuration (JSP)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
